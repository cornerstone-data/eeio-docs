<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a727c"/>
    </marker>
    <marker id="arrow-us" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/>
    </marker>
  </defs>
  <rect width="780" height="260" fill="#ffffff"/>

  <!-- U.S. path: skips steps 2 to 4 -->
  <path d="M60,70 L60,44 L500,44 L500,66" fill="none" stroke="#d98a1f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-us)"/>
  <text x="280" y="36" text-anchor="middle" font-size="11" fill="#b06f12">U.S.: already on the 405 common sectors, with all 7 gases</text>

  <!-- 1 Source emissions -->
  <rect x="14" y="70" width="92" height="80" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="22" y="86" font-size="10" fill="#6a727c">1</text>
  <text x="60" y="106" text-anchor="middle" font-weight="700">Source</text>
  <text x="60" y="122" text-anchor="middle" font-weight="700">emissions</text>
  <text x="60" y="140" text-anchor="middle" font-size="10" fill="#6a727c">by source sector</text>

  <!-- 2 Split -->
  <rect x="124" y="70" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="132" y="86" font-size="10" fill="#6a727c">2</text>
  <text x="170" y="108" text-anchor="middle" font-weight="700">Split broad</text>
  <text x="170" y="124" text-anchor="middle" font-weight="700">sectors</text>

  <!-- 3 Spread -->
  <rect x="234" y="70" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="242" y="86" font-size="10" fill="#6a727c">3</text>
  <text x="280" y="108" text-anchor="middle" font-weight="700">Spread onto</text>
  <text x="280" y="124" text-anchor="middle" font-weight="700">405 sectors</text>

  <!-- 4 Fill gases -->
  <rect x="344" y="70" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="352" y="86" font-size="10" fill="#6a727c">4</text>
  <text x="390" y="108" text-anchor="middle" font-weight="700">Fill in</text>
  <text x="390" y="124" text-anchor="middle" font-weight="700">gas detail</text>

  <!-- 5 AR6 -->
  <rect x="454" y="70" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="462" y="86" font-size="10" fill="#6a727c">5</text>
  <text x="500" y="108" text-anchor="middle" font-weight="700">Convert</text>
  <text x="500" y="124" text-anchor="middle" font-weight="700">to AR6</text>

  <!-- 6 Divide -->
  <rect x="564" y="70" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="572" y="86" font-size="10" fill="#6a727c">6</text>
  <text x="610" y="108" text-anchor="middle" font-weight="700">Divide by</text>
  <text x="610" y="124" text-anchor="middle" font-weight="700">output q</text>

  <!-- B -->
  <rect x="674" y="70" width="92" height="80" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="2.5"/>
  <text x="720" y="116" text-anchor="middle" font-size="22" font-weight="700">B</text>
  <text x="720" y="136" text-anchor="middle" font-size="10" fill="#6a727c">kg gas per $</text>

  <!-- Arrows -->
  <line x1="106" y1="110" x2="123" y2="110" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="216" y1="110" x2="233" y2="110" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="326" y1="110" x2="343" y2="110" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="436" y1="110" x2="453" y2="110" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="546" y1="110" x2="563" y2="110" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="656" y1="110" x2="673" y2="110" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Captions -->
  <g font-size="11" fill="#6a727c" text-anchor="middle">
    <text x="60" y="172">National inventory,</text>
    <text x="60" y="186">national accounts,</text>
    <text x="60" y="200">FIGARO, or ICIO</text>

    <text x="170" y="172">For example,</text>
    <text x="170" y="186">electricity, gas,</text>
    <text x="170" y="200">and heat; farming</text>

    <text x="280" y="172">With ABSR,</text>
    <text x="280" y="186">weighted by U.S.</text>
    <text x="280" y="200">intensities</text>

    <text x="390" y="172">Missing gases</text>
    <text x="390" y="186">from the U.S. mix</text>
    <text x="390" y="200">for the sector</text>

    <text x="500" y="172">Sources reported</text>
    <text x="500" y="186">as AR5 CO₂e,</text>
    <text x="500" y="200">gas by gas</text>

    <text x="610" y="172">The same sector's</text>
    <text x="610" y="186">output in the</text>
    <text x="610" y="200">IO model</text>

    <text x="720" y="172">7 gases ×</text>
    <text x="720" y="186">405 sectors,</text>
    <text x="720" y="200">for each country</text>
  </g>

  <!-- Totals bracket under steps 2-4 -->
  <path d="M124,218 L124,226 L436,226 L436,218" fill="none" stroke="#d1d1cf" stroke-width="1.5"/>
  <text x="280" y="246" text-anchor="middle" font-size="12">Each country's source totals are kept through steps 2 to 4</text>
</svg>
