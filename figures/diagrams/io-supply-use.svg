<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <rect width="800" height="310" fill="#ffffff"/>

  <!-- Supply table -->
  <text x="20" y="28" font-size="16" font-weight="700">Supply table (V)</text>
  <text x="205" y="60" text-anchor="middle" font-size="12" fill="#6a727c">Commodities</text>

  <text x="98" y="124" text-anchor="end" font-size="12" fill="#6a727c">Industries</text>
  <rect x="105" y="70" width="200" height="100" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="205" y="108" text-anchor="middle">Production of each</text>
  <text x="205" y="125" text-anchor="middle">commodity by each</text>
  <text x="205" y="142" text-anchor="middle">domestic industry</text>

  <rect x="313" y="70" width="64" height="100" rx="4" fill="#ffffff" stroke="#6a727c" stroke-dasharray="4 3"/>
  <text x="345" y="112" text-anchor="middle" font-size="16" font-weight="700">x</text>
  <text x="345" y="130" text-anchor="middle" font-size="11" fill="#6a727c">row sums</text>

  <rect x="105" y="178" width="200" height="32" rx="4" fill="#ffffff" stroke="#6a727c" stroke-dasharray="4 3"/>
  <text x="205" y="199" text-anchor="middle"><tspan font-weight="700">q</tspan>  column sums</text>

  <text x="98" y="243" text-anchor="end" font-size="12" fill="#6a727c">Imports</text>
  <rect x="105" y="218" width="200" height="40" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="205" y="243" text-anchor="middle">Imports of each commodity</text>

  <text x="20" y="290" font-size="12" fill="#6a727c">x = industry output · q = commodity output</text>

  <!-- Use table -->
  <text x="420" y="28" font-size="16" font-weight="700">Use table (U, y)</text>
  <text x="565" y="60" text-anchor="middle" font-size="12" fill="#6a727c">Industries</text>
  <text x="713" y="60" text-anchor="middle" font-size="12" fill="#6a727c">Final demand</text>

  <text x="488" y="124" text-anchor="end" font-size="12" fill="#6a727c">Commodities</text>
  <rect x="495" y="70" width="140" height="100" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="565" y="108" text-anchor="middle">Commodities</text>
  <text x="565" y="125" text-anchor="middle">bought by</text>
  <text x="565" y="142" text-anchor="middle">industries</text>

  <rect x="643" y="70" width="140" height="100" rx="4" fill="#dff0e0" stroke="#3f9a4b" stroke-width="1.5"/>
  <text x="713" y="100" text-anchor="middle">Households,</text>
  <text x="713" y="117" text-anchor="middle">government,</text>
  <text x="713" y="134" text-anchor="middle">investment,</text>
  <text x="713" y="151" text-anchor="middle">exports</text>

  <text x="488" y="207" text-anchor="end" font-size="12" fill="#6a727c">Value added</text>
  <rect x="495" y="178" width="140" height="48" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="565" y="199" text-anchor="middle">Wages, taxes,</text>
  <text x="565" y="216" text-anchor="middle">profits</text>

  <rect x="495" y="234" width="140" height="32" rx="4" fill="#ffffff" stroke="#6a727c" stroke-dasharray="4 3"/>
  <text x="565" y="255" text-anchor="middle"><tspan font-weight="700">x</tspan>  column sums</text>

  <text x="420" y="290" font-size="12" fill="#6a727c">Each industry: inputs + value added = output x</text>
</svg>
