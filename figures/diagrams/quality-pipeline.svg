<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a727c"/>
    </marker>
  </defs>
  <rect width="780" height="230" fill="#ffffff"/>

  <!-- build stages -->
  <rect x="14" y="20" width="128" height="56" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="78" y="44" text-anchor="middle" font-weight="700">Acquire</text>
  <text x="78" y="60" text-anchor="middle" font-size="10" fill="#6a727c">source data</text>

  <rect x="168" y="20" width="128" height="56" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="232" y="44" text-anchor="middle" font-weight="700">Transform</text>
  <text x="232" y="60" text-anchor="middle" font-size="10" fill="#6a727c">map, split, balance</text>

  <rect x="322" y="20" width="128" height="56" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="386" y="44" text-anchor="middle" font-weight="700">Build model</text>
  <text x="386" y="60" text-anchor="middle" font-size="10" fill="#6a727c">A, L, B, D</text>

  <rect x="476" y="20" width="128" height="56" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="540" y="44" text-anchor="middle" font-weight="700">Calculate</text>
  <text x="540" y="60" text-anchor="middle" font-size="10" fill="#6a727c">emission factors</text>

  <rect x="630" y="20" width="136" height="56" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="2.5"/>
  <text x="698" y="44" text-anchor="middle" font-weight="700">Publish</text>
  <text x="698" y="60" text-anchor="middle" font-size="10" fill="#6a727c">release files</text>

  <line x1="142" y1="48" x2="166" y2="48" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="296" y1="48" x2="320" y2="48" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="48" x2="474" y2="48" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="604" y1="48" x2="628" y2="48" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- data validation band -->
  <rect x="14" y="96" width="282" height="34" rx="4" fill="#fdf3e7" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="155" y="112" text-anchor="middle" font-weight="700">2 · Data validation</text>
  <text x="155" y="125" text-anchor="middle" font-size="10" fill="#6a727c">on arrival, through each step, against references</text>

  <!-- model validation band -->
  <rect x="322" y="96" width="444" height="34" rx="4" fill="#eaf6fb" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="544" y="112" text-anchor="middle" font-weight="700">3 · Model validation</text>
  <text x="544" y="125" text-anchor="middle" font-size="10" fill="#6a727c">national emissions, balance, previous results, published files</text>

  <!-- code validation band -->
  <rect x="14" y="142" width="752" height="34" rx="4" fill="#f6f6f4" stroke="#6a727c" stroke-width="1.5"/>
  <text x="390" y="158" text-anchor="middle" font-weight="700">1 · Code validation</text>
  <text x="390" y="171" text-anchor="middle" font-size="10" fill="#6a727c">unit, integration and regression tests on every change to the code that runs each step</text>

  <text x="14" y="206" font-size="11" fill="#6a727c">Benchmarking against independent evidence follows the build and feeds the next release; see "Why we benchmark".</text>
</svg>
