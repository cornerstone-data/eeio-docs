<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" width="780" height="210" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a727c"/>
    </marker>
  </defs>
  <rect width="780" height="210" fill="#ffffff"/>

  <!-- Inputs: D/B and L -->
  <rect x="14" y="20" width="110" height="36" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="69" y="37" text-anchor="middle" font-weight="700">D and B</text>
  <text x="69" y="50" text-anchor="middle" font-size="10" fill="#6a727c">kg CO₂e per $</text>
  <rect x="14" y="64" width="110" height="36" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="69" y="87" text-anchor="middle" font-weight="700">L</text>
  <text x="69" y="118" text-anchor="middle" font-size="10" fill="#6a727c">from the GHG extension</text>
  <text x="69" y="131" text-anchor="middle" font-size="10" fill="#6a727c">and the IO model</text>

  <!-- 1 Total emission factors -->
  <rect x="148" y="20" width="132" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="156" y="36" font-size="10" fill="#6a727c">1</text>
  <text x="214" y="50" text-anchor="middle" font-weight="700">Total emission</text>
  <text x="214" y="66" text-anchor="middle" font-weight="700">factors</text>
  <text x="214" y="81" text-anchor="middle" font-size="10" fill="#6a727c">N = D × L</text>
  <text x="214" y="93" text-anchor="middle" font-size="10" fill="#6a727c">by gas, M = B × L</text>

  <!-- 2 Regions and fill -->
  <rect x="304" y="20" width="120" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="312" y="36" font-size="10" fill="#6a727c">2</text>
  <text x="364" y="58" text-anchor="middle" font-weight="700">Regional</text>
  <text x="364" y="74" text-anchor="middle" font-weight="700">averages</text>
  <text x="364" y="90" text-anchor="middle" font-size="10" fill="#6a727c">and gap filling</text>

  <!-- 3 Re-price -->
  <rect x="448" y="20" width="120" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="456" y="36" font-size="10" fill="#6a727c">3</text>
  <text x="508" y="58" text-anchor="middle" font-weight="700">Re-price to</text>
  <text x="508" y="74" text-anchor="middle" font-weight="700">each year</text>
  <text x="508" y="90" text-anchor="middle" font-size="10" fill="#6a727c">2024, 2025, 2026</text>

  <!-- PRO output -->
  <rect x="600" y="20" width="166" height="36" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="2.5"/>
  <text x="683" y="43" text-anchor="middle" font-weight="700">Producer price (PRO)</text>

  <!-- 4 PUR -->
  <rect x="600" y="120" width="166" height="36" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="2.5"/>
  <text x="683" y="143" text-anchor="middle" font-weight="700">Purchaser price (PUR)</text>
  <text x="675" y="84" font-size="10" fill="#6a727c" text-anchor="end">4</text>
  <text x="691" y="92" font-weight="700">× φ</text>

  <!-- arrows -->
  <line x1="124" y1="38" x2="146" y2="52" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="124" y1="82" x2="146" y2="68" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="60" x2="302" y2="60" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="424" y1="60" x2="446" y2="60" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="568" y1="48" x2="598" y2="40" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="683" y1="56" x2="683" y2="118" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- notes -->
  <text x="148" y="150" font-size="11" fill="#6a727c">Steps 1 and 2 are in 2024 U.S. dollars at producer price, by country of production.</text>
  <text x="148" y="166" font-size="11" fill="#6a727c">Step 3 uses U.S. price indexes; step 4 uses U.S. trade and transport margins.</text>
  <text x="148" y="190" font-size="11" fill="#6a727c">Emissions of the margin services themselves are published separately as margin emission factors.</text>
</svg>
