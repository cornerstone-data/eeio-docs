<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <rect width="780" height="380" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="285" y="22" text-anchor="middle" font-size="12" fill="#6a727c">Buying country (columns)</text>
  <text x="165" y="50" text-anchor="middle" font-size="12" font-weight="700">Country 1</text>
  <text x="261" y="50" text-anchor="middle" font-size="12" font-weight="700">Country 2</text>
  <text x="357" y="50" text-anchor="middle" font-size="12" font-weight="700">Country 3</text>
  <text x="433" y="50" text-anchor="middle" font-size="12" font-weight="700">…</text>

  <!-- Row headers -->
  <text x="20" y="22" font-size="12" fill="#6a727c">Selling country (rows)</text>
  <text x="104" y="110" text-anchor="end" font-size="12" font-weight="700">Country 1</text>
  <text x="104" y="186" text-anchor="end" font-size="12" font-weight="700">Country 2</text>
  <text x="104" y="262" text-anchor="end" font-size="12" font-weight="700">Country 3</text>
  <text x="104" y="323" text-anchor="end" font-size="12" font-weight="700">…</text>

  <!-- Brackets -->
  <path d="M116 64 h-6 v284 h6" fill="none" stroke="#29a7d5" stroke-width="2"/>
  <path d="M462 64 h6 v284 h-6" fill="none" stroke="#29a7d5" stroke-width="2"/>

  <!-- Row 1 -->
  <rect x="120" y="70" width="90" height="70" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="165" y="110" text-anchor="middle" font-weight="700">A<tspan dy="4" font-size="10">dom</tspan></text>
  <rect x="216" y="70" width="90" height="70" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="261" y="102" text-anchor="middle" font-size="12">Imports</text>
  <text x="261" y="118" text-anchor="middle" font-size="12">from 1</text>
  <rect x="312" y="70" width="90" height="70" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="357" y="102" text-anchor="middle" font-size="12">Imports</text>
  <text x="357" y="118" text-anchor="middle" font-size="12">from 1</text>
  <text x="433" y="110" text-anchor="middle" fill="#6a727c">…</text>

  <!-- Row 2 -->
  <rect x="120" y="146" width="90" height="70" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="165" y="178" text-anchor="middle" font-size="12">Imports</text>
  <text x="165" y="194" text-anchor="middle" font-size="12">from 2</text>
  <rect x="216" y="146" width="90" height="70" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="261" y="186" text-anchor="middle" font-weight="700">A<tspan dy="4" font-size="10">dom</tspan></text>
  <rect x="312" y="146" width="90" height="70" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="357" y="178" text-anchor="middle" font-size="12">Imports</text>
  <text x="357" y="194" text-anchor="middle" font-size="12">from 2</text>
  <text x="433" y="186" text-anchor="middle" fill="#6a727c">…</text>

  <!-- Row 3 -->
  <rect x="120" y="222" width="90" height="70" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="165" y="254" text-anchor="middle" font-size="12">Imports</text>
  <text x="165" y="270" text-anchor="middle" font-size="12">from 3</text>
  <rect x="216" y="222" width="90" height="70" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="261" y="254" text-anchor="middle" font-size="12">Imports</text>
  <text x="261" y="270" text-anchor="middle" font-size="12">from 3</text>
  <rect x="312" y="222" width="90" height="70" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="357" y="262" text-anchor="middle" font-weight="700">A<tspan dy="4" font-size="10">dom</tspan></text>
  <text x="433" y="262" text-anchor="middle" fill="#6a727c">…</text>

  <!-- Row … -->
  <text x="165" y="323" text-anchor="middle" fill="#6a727c">…</text>
  <text x="261" y="323" text-anchor="middle" fill="#6a727c">…</text>
  <text x="357" y="323" text-anchor="middle" fill="#6a727c">…</text>

  <!-- Highlight column 2 -->
  <rect x="212" y="66" width="98" height="280" rx="6" fill="none" stroke="#29a7d5" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="120" y="370" font-size="12" fill="#6a727c">Each block is 405 × 405 sectors · 65 countries plus rest of world</text>

  <!-- Right panel -->
  <text x="530" y="50" font-size="14" font-weight="700">Filling Country 2's column</text>
  <rect x="530" y="62" width="200" height="46" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="630" y="90" text-anchor="middle" font-weight="700">A<tspan dy="4" font-size="10">imp</tspan><tspan dy="-4" font-weight="400"> of Country 2</tspan></text>

  <line x1="630" y1="110" x2="630" y2="150" stroke="#6a727c" stroke-width="1.5"/>
  <path d="M624 143 l6 9 l6 -9" fill="none" stroke="#6a727c" stroke-width="1.5"/>
  <text x="642" y="126" font-size="11" fill="#6a727c">× trade shares by</text>
  <text x="642" y="141" font-size="11" fill="#6a727c">origin and product</text>

  <rect x="530" y="158" width="200" height="34" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="630" y="180" text-anchor="middle" font-size="12">Imports from Country 1</text>
  <rect x="530" y="198" width="200" height="34" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="630" y="220" text-anchor="middle" font-size="12">Imports from Country 3</text>
  <rect x="530" y="238" width="200" height="34" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.2"/>
  <text x="630" y="260" text-anchor="middle" font-size="12">… and rest of world</text>

  <text x="530" y="300" font-size="12" fill="#6a727c">Every buyer of a product in Country 2</text>
  <text x="530" y="316" font-size="12" fill="#6a727c">gets the same mix of origins. The</text>
  <text x="530" y="332" font-size="12" fill="#6a727c">blocks add back up to A<tspan dy="3" font-size="9">imp</tspan><tspan dy="-3">.</tspan></text>
</svg>
