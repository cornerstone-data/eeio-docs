# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: Cornerstone EEIO Model
  description: Theory, assumptions, data, and practical guidance for the Cornerstone multi-regional EEIO model and its emission factors.
  keywords: [EEIO, MRIO, input-output, emission factors, Scope 3, greenhouse gas]
  authors:
    - name: Cornerstone Sustainability Data Initiative
  github: https://github.com/cornerstone-data/eeio-docs
  bibliography:
    - references.bib
  exclude:
    - README.md
    - CONTRIBUTING.md
    - _parts/**
    - drafts/**
  exports:
    - id: guide-pdf
      format: typst
      template: plain_typst_book
      output: exports/cornerstone-eeio-guide.pdf
  toc:
    - file: index.md
    - title: Introduction to EEIO models
      children:
        - file: intro/what-is-eeio.md
        - file: intro/io-part.md
        - file: intro/multi-regional.md
        - file: intro/ee-part.md
        - file: intro/emission-factors.md
        - file: intro/uses-and-limits.md
    - title: The IO model
      children:
        - file: io/index.md
        - file: io/country-tiers.md
    - title: The GHG extension
      children:
        - file: ee/index.md
        - file: ee/data-sources.md
    - title: Emission factors
      children:
        - file: factors/whats-in-a-release.md
        - file: factors/choose-a-factor.md
        - file: factors/prices-and-margins.md
        - file: factors/year-and-currency.md
        - file: factors/downloads.md
    - file: validation/index.md
    - file: benchmarking/index.md
    - title: Reference
      children:
        - file: reference/glossary.md
        - file: reference/notation.md
        - file: reference/methods-by-country.md
        - file: reference/data-sources.md
    - file: releases/index.md
      children:
        - file: releases/rc.md
    - file: faq.md
site:
  template: book-theme
  nav:
    - title: Get the factors
      url: /factors/downloads
    - title: FAQs
      url: /faq
  options:
    logo: images/cornerstone-wordmark.svg
    logo_dark: images/cornerstone-wordmark-dark.svg
    logo_text: EEIO Model
    logo_alt: Cornerstone
    folders: true
    style: _parts/custom.css
  parts:
    navbar_end: _parts/navbar.md
    footer: _parts/footer.md
