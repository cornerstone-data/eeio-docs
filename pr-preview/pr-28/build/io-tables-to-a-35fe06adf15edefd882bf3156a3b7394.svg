<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 285" width="780" height="285" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <rect width="780" height="285" fill="#ffffff"/>

  <!-- Domestic row -->
  <rect x="40" y="30" width="140" height="110" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="110" y="82" text-anchor="middle" font-size="16" font-weight="700">U<tspan dy="4" font-size="11">dom</tspan><tspan dy="-4"> ÷ x</tspan></text>
  <text x="110" y="104" text-anchor="middle" font-size="11" fill="#6a727c">commodity × industry</text>

  <text x="210" y="92" text-anchor="middle" font-size="24" fill="#6a727c">×</text>

  <rect x="240" y="30" width="140" height="110" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="310" y="82" text-anchor="middle" font-size="16" font-weight="700">V ÷ q</text>
  <text x="310" y="104" text-anchor="middle" font-size="11" fill="#6a727c">industry × commodity</text>

  <text x="410" y="92" text-anchor="middle" font-size="24" fill="#6a727c">=</text>

  <rect x="440" y="30" width="110" height="110" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="2.5"/>
  <text x="495" y="82" text-anchor="middle" font-size="18" font-weight="700">A<tspan dy="4" font-size="12">dom</tspan></text>
  <text x="495" y="104" text-anchor="middle" font-size="11" fill="#6a727c">commodity ×</text>
  <text x="495" y="118" text-anchor="middle" font-size="11" fill="#6a727c">commodity</text>

  <!-- Captions -->
  <text x="110" y="164" text-anchor="middle" font-size="12">Inputs per $ of</text>
  <text x="110" y="180" text-anchor="middle" font-size="12">industry output</text>
  <text x="310" y="164" text-anchor="middle" font-size="12">Market shares: who</text>
  <text x="310" y="180" text-anchor="middle" font-size="12">makes each commodity</text>
  <text x="495" y="164" text-anchor="middle" font-size="12">Domestic inputs per $</text>
  <text x="495" y="180" text-anchor="middle" font-size="12">of commodity output</text>

  <!-- Imported row -->
  <rect x="40" y="215" width="140" height="48" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="110" y="244" text-anchor="middle" font-size="15" font-weight="700">U<tspan dy="4" font-size="11">imp</tspan><tspan dy="-4"> ÷ x</tspan></text>
  <text x="210" y="248" text-anchor="middle" font-size="22" fill="#6a727c">×</text>
  <rect x="240" y="215" width="140" height="48" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="310" y="244" text-anchor="middle" font-size="15" font-weight="700">V ÷ q</text>
  <text x="410" y="248" text-anchor="middle" font-size="22" fill="#6a727c">=</text>
  <rect x="440" y="215" width="110" height="48" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="2.5"/>
  <text x="495" y="245" text-anchor="middle" font-size="17" font-weight="700">A<tspan dy="4" font-size="12">imp</tspan></text>

  <!-- Side note -->
  <line x1="580" y1="30" x2="580" y2="263" stroke="#d1d1cf"/>
  <text x="600" y="62" font-size="13" font-weight="700">Read a column of A</text>
  <text x="600" y="84" font-size="12" fill="#6a727c">as the recipe of inputs</text>
  <text x="600" y="100" font-size="12" fill="#6a727c">needed to make $1 of</text>
  <text x="600" y="116" font-size="12" fill="#6a727c">that commodity.</text>
  <text x="600" y="150" font-size="13" font-weight="700">A = A<tspan dy="4" font-size="10">dom</tspan><tspan dy="-4"> + A</tspan><tspan dy="4" font-size="10">imp</tspan></text>
  <text x="600" y="172" font-size="12" fill="#6a727c">Both use the same</text>
  <text x="600" y="188" font-size="12" fill="#6a727c">market shares.</text>
</svg>
