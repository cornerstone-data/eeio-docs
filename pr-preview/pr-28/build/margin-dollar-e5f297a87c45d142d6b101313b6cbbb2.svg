<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 190" width="780" height="190" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <rect width="780" height="190" fill="#ffffff"/>

  <text x="14" y="28" font-weight="700">$1 spent at purchaser price on a good</text>

  <!-- stacked bar -->
  <rect x="14" y="42" width="470" height="44" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="249" y="62" text-anchor="middle" font-weight="700">Producer value (φ)</text>
  <text x="249" y="78" text-anchor="middle" font-size="10" fill="#6a727c">what the producer receives</text>

  <rect x="484" y="42" width="120" height="44" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="544" y="62" text-anchor="middle" font-weight="700">Wholesale</text>
  <text x="544" y="78" text-anchor="middle" font-size="10" fill="#6a727c">margin</text>

  <rect x="604" y="42" width="90" height="44" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="649" y="62" text-anchor="middle" font-weight="700">Retail</text>
  <text x="649" y="78" text-anchor="middle" font-size="10" fill="#6a727c">margin</text>

  <rect x="694" y="42" width="72" height="44" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="730" y="62" text-anchor="middle" font-weight="700">Transport</text>
  <text x="730" y="78" text-anchor="middle" font-size="10" fill="#6a727c">margin</text>

  <!-- braces as lines -->
  <line x1="14" y1="100" x2="484" y2="100" stroke="#29a7d5" stroke-width="2"/>
  <line x1="14" y1="96" x2="14" y2="104" stroke="#29a7d5" stroke-width="2"/>
  <line x1="484" y1="96" x2="484" y2="104" stroke="#29a7d5" stroke-width="2"/>
  <text x="249" y="122" text-anchor="middle" font-weight="700">Purchaser-price emission factor</text>
  <text x="249" y="138" text-anchor="middle" font-size="11" fill="#6a727c">emissions of making the good, per purchaser dollar</text>

  <line x1="484" y1="100" x2="766" y2="100" stroke="#6a727c" stroke-width="2"/>
  <line x1="484" y1="96" x2="484" y2="104" stroke="#6a727c" stroke-width="2"/>
  <line x1="766" y1="96" x2="766" y2="104" stroke="#6a727c" stroke-width="2"/>
  <text x="625" y="122" text-anchor="middle" font-weight="700">Margin emission factors</text>
  <text x="625" y="138" text-anchor="middle" font-size="11" fill="#6a727c">emissions of the trade and transport</text>
  <text x="625" y="152" text-anchor="middle" font-size="11" fill="#6a727c">services that deliver it</text>

  <text x="14" y="178" font-size="11" fill="#6a727c">Bar widths are illustrative. Services and electricity have no margins, so φ = 1 and their margin factors are zero.</text>
</svg>
