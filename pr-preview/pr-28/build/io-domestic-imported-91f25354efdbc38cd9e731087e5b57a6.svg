<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 250" width="712" height="250" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <rect width="712" height="250" fill="#ffffff"/>

  <!-- Total use -->
  <text x="110" y="28" text-anchor="middle" font-size="15" font-weight="700">Use table</text>
  <text x="70" y="52" text-anchor="middle" font-size="11" fill="#6a727c">Industries</text>
  <text x="165" y="52" text-anchor="middle" font-size="11" fill="#6a727c">Final demand</text>
  <rect x="20" y="60" width="100" height="90" rx="4" fill="#eef3f6" stroke="#6a727c" stroke-width="1.5"/>
  <text x="70" y="110" text-anchor="middle" font-size="15" font-weight="700">U</text>
  <rect x="126" y="60" width="78" height="90" rx="4" fill="#eef3f6" stroke="#6a727c" stroke-width="1.5"/>
  <text x="165" y="110" text-anchor="middle" font-size="15" font-weight="700">y</text>
  <text x="112" y="175" text-anchor="middle" font-size="12" fill="#6a727c">All purchases, whatever</text>
  <text x="112" y="191" text-anchor="middle" font-size="12" fill="#6a727c">their origin</text>

  <text x="233" y="112" text-anchor="middle" font-size="24" fill="#6a727c">=</text>

  <!-- Domestic use -->
  <text x="353" y="28" text-anchor="middle" font-size="15" font-weight="700">Domestic use</text>
  <text x="312" y="52" text-anchor="middle" font-size="11" fill="#6a727c">Industries</text>
  <text x="408" y="52" text-anchor="middle" font-size="11" fill="#6a727c">Final demand</text>
  <rect x="262" y="60" width="100" height="90" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="312" y="110" text-anchor="middle" font-size="15" font-weight="700">U<tspan dy="4" font-size="11">dom</tspan></text>
  <rect x="368" y="60" width="80" height="90" rx="4" fill="#dff0e0" stroke="#3f9a4b" stroke-width="1.5"/>
  <text x="408" y="102" text-anchor="middle" font-size="15" font-weight="700">y<tspan dy="4" font-size="11">dom</tspan></text>
  <text x="408" y="124" text-anchor="middle" font-size="12">+ exports</text>
  <path d="M368 158 v8 h80 v-8" fill="none" stroke="#3f9a4b" stroke-width="1.5"/>
  <line x1="408" y1="166" x2="408" y2="178" stroke="#3f9a4b" stroke-width="1.5"/>
  <text x="408" y="196" text-anchor="middle" font-size="14" font-weight="700">y<tspan dy="4" font-size="11">nab</tspan></text>
  <text x="408" y="218" text-anchor="middle" font-size="12" fill="#6a727c">final demand for</text>
  <text x="408" y="234" text-anchor="middle" font-size="12" fill="#6a727c">domestic production</text>

  <text x="477" y="112" text-anchor="middle" font-size="24" fill="#6a727c">+</text>

  <!-- Imported use -->
  <text x="597" y="28" text-anchor="middle" font-size="15" font-weight="700">Imported use</text>
  <text x="556" y="52" text-anchor="middle" font-size="11" fill="#6a727c">Industries</text>
  <text x="652" y="52" text-anchor="middle" font-size="11" fill="#6a727c">Final demand</text>
  <rect x="506" y="60" width="100" height="90" rx="4" fill="#fbe3c4" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="556" y="110" text-anchor="middle" font-size="15" font-weight="700">U<tspan dy="4" font-size="11">imp</tspan></text>
  <rect x="612" y="60" width="80" height="90" rx="4" fill="#fdf0de" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="652" y="110" text-anchor="middle" font-size="15" font-weight="700">y<tspan dy="4" font-size="11">imp</tspan></text>
  <text x="599" y="175" text-anchor="middle" font-size="12" fill="#6a727c">Imported inputs and</text>
  <text x="599" y="191" text-anchor="middle" font-size="12" fill="#6a727c">imported final purchases</text>
</svg>
