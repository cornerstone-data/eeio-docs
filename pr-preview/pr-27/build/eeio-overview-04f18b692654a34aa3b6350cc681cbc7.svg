<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a727c"/>
    </marker>
  </defs>
  <rect width="780" height="230" fill="#ffffff"/>

  <!-- IO tables -->
  <rect x="14" y="14" width="266" height="92" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <g stroke="#6a727c" stroke-width="1" fill="#ffffff">
    <rect x="30" y="32" width="14" height="14"/><rect x="44" y="32" width="14" height="14" fill="#d4edf7"/><rect x="58" y="32" width="14" height="14"/><rect x="72" y="32" width="14" height="14" fill="#d4edf7"/>
    <rect x="30" y="46" width="14" height="14" fill="#d4edf7"/><rect x="44" y="46" width="14" height="14"/><rect x="58" y="46" width="14" height="14" fill="#d4edf7"/><rect x="72" y="46" width="14" height="14"/>
    <rect x="30" y="60" width="14" height="14"/><rect x="44" y="60" width="14" height="14" fill="#d4edf7"/><rect x="58" y="60" width="14" height="14"/><rect x="72" y="60" width="14" height="14"/>
    <rect x="30" y="74" width="14" height="14" fill="#d4edf7"/><rect x="44" y="74" width="14" height="14"/><rect x="58" y="74" width="14" height="14" fill="#d4edf7"/><rect x="72" y="74" width="14" height="14" fill="#d4edf7"/>
  </g>
  <text x="104" y="42" font-weight="700" font-size="14">Input-output tables</text>
  <text x="104" y="60" font-size="11" fill="#6a727c">Dollars flowing between</text>
  <text x="104" y="74" font-size="11" fill="#6a727c">sectors and to final users</text>
  <text x="104" y="94" font-weight="700">V, U → A, L</text>

  <!-- Environmental extension -->
  <rect x="14" y="124" width="266" height="92" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <g stroke="#6a727c" stroke-width="1">
    <rect x="30" y="163" width="14" height="14" fill="#29a7d5"/>
    <rect x="44" y="163" width="14" height="14" fill="#ffffff"/>
    <rect x="58" y="163" width="14" height="14" fill="#d4edf7"/>
    <rect x="72" y="163" width="14" height="14" fill="#7fc9e6"/>
  </g>
  <text x="58" y="155" text-anchor="middle" font-size="10" fill="#6a727c">CO₂, CH₄, …</text>
  <text x="104" y="152" font-weight="700" font-size="14">Environmental extension</text>
  <text x="104" y="170" font-size="11" fill="#6a727c">Greenhouse gases emitted</text>
  <text x="104" y="184" font-size="11" fill="#6a727c">by each sector</text>
  <text x="104" y="204" font-weight="700">E → B, C</text>

  <!-- Arrows into the model -->
  <path d="M280,60 H310 V105 H338" fill="none" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M280,170 H310 V125 H338" fill="none" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- EEIO model -->
  <rect x="340" y="60" width="180" height="110" rx="4" fill="#f6f6f4" stroke="#29a7d5" stroke-width="2"/>
  <text x="430" y="96" text-anchor="middle" font-weight="700" font-size="16">EEIO model</text>
  <text x="430" y="122" text-anchor="middle" font-size="12" fill="#6a727c">Emissions traced through</text>
  <text x="430" y="138" text-anchor="middle" font-size="12" fill="#6a727c">every round of suppliers</text>

  <line x1="520" y1="115" x2="559" y2="115" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Emission factors -->
  <rect x="562" y="60" width="204" height="110" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="2.5"/>
  <text x="664" y="88" text-anchor="middle" font-weight="700" font-size="14">Emission factors</text>
  <text x="664" y="122" text-anchor="middle" font-weight="700" font-size="22">D, N</text>
  <text x="664" y="146" text-anchor="middle" font-size="11" fill="#6a727c">kg CO₂e per $ of purchases,</text>
  <text x="664" y="160" text-anchor="middle" font-size="11" fill="#6a727c">by sector and country</text>
</svg>
