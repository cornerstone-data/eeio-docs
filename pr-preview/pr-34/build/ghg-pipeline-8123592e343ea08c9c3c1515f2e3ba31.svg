<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 190" width="780" height="190" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3746">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a727c"/>
    </marker>
  </defs>
  <rect width="780" height="190" fill="#ffffff"/>

  <!-- 1 Source emissions -->
  <rect x="14" y="20" width="92" height="80" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="1.5"/>
  <text x="22" y="36" font-size="10" fill="#6a727c">1</text>
  <text x="60" y="56" text-anchor="middle" font-weight="700">Source</text>
  <text x="60" y="72" text-anchor="middle" font-weight="700">emissions</text>
  <text x="60" y="90" text-anchor="middle" font-size="10" fill="#6a727c">by source sector</text>

  <!-- 2 Split -->
  <rect x="124" y="20" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="132" y="36" font-size="10" fill="#6a727c">2</text>
  <text x="170" y="58" text-anchor="middle" font-weight="700">Split broad</text>
  <text x="170" y="74" text-anchor="middle" font-weight="700">sectors</text>

  <!-- 3 Allocate -->
  <rect x="234" y="20" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="242" y="36" font-size="10" fill="#6a727c">3</text>
  <text x="280" y="58" text-anchor="middle" font-weight="700">Allocate to</text>
  <text x="280" y="74" text-anchor="middle" font-weight="700">405 sectors</text>

  <!-- 4 Fill gases: only where needed -->
  <rect x="344" y="20" width="92" height="80" rx="4" fill="#f6f6f4" stroke="#6a727c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="352" y="36" font-size="10" fill="#6a727c">4</text>
  <text x="390" y="58" text-anchor="middle" font-weight="700">Fill in</text>
  <text x="390" y="74" text-anchor="middle" font-weight="700">gas detail</text>
  <text x="390" y="90" text-anchor="middle" font-size="10" fill="#6a727c">where needed</text>

  <!-- 5 AR6 -->
  <rect x="454" y="20" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="462" y="36" font-size="10" fill="#6a727c">5</text>
  <text x="500" y="58" text-anchor="middle" font-weight="700">Convert to</text>
  <text x="500" y="74" text-anchor="middle" font-weight="700">CO₂e</text>
  <text x="500" y="90" text-anchor="middle" font-size="10" fill="#6a727c">AR6 GWPs</text>

  <!-- 6 Divide -->
  <rect x="564" y="20" width="92" height="80" rx="4" fill="#ececea" stroke="#6a727c" stroke-width="1.5"/>
  <text x="572" y="36" font-size="10" fill="#6a727c">6</text>
  <text x="610" y="58" text-anchor="middle" font-weight="700">Divide by</text>
  <text x="610" y="74" text-anchor="middle" font-weight="700">output</text>
  <text x="610" y="90" text-anchor="middle" font-size="10" fill="#6a727c">x, then per q</text>

  <!-- B -->
  <rect x="674" y="20" width="92" height="80" rx="4" fill="#d4edf7" stroke="#29a7d5" stroke-width="2.5"/>
  <text x="720" y="60" text-anchor="middle" font-size="22" font-weight="700">B</text>
  <text x="720" y="80" text-anchor="middle" font-size="10" fill="#6a727c">kg CO₂e per $</text>
  <text x="720" y="92" text-anchor="middle" font-size="10" fill="#6a727c">by gas</text>

  <!-- Arrows -->
  <line x1="106" y1="60" x2="123" y2="60" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="216" y1="60" x2="233" y2="60" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="326" y1="60" x2="343" y2="60" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="436" y1="60" x2="453" y2="60" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="546" y1="60" x2="563" y2="60" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="656" y1="60" x2="673" y2="60" stroke="#6a727c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Note under step 4 -->
  <text x="390" y="120" text-anchor="middle" font-size="11" fill="#6a727c">Not needed for the U.S.,</text>
  <text x="390" y="134" text-anchor="middle" font-size="11" fill="#6a727c">China, Japan, or the UK</text>

  <!-- Totals bracket under steps 2-4 -->
  <path d="M124,148 L124,156 L436,156 L436,148" fill="none" stroke="#d1d1cf" stroke-width="1.5"/>
  <text x="280" y="176" text-anchor="middle" font-size="12">Each country's source totals are kept through steps 2 to 4</text>
</svg>
