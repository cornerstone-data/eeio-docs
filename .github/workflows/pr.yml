# Build every PR, publish a preview, and check links.
# Previews are served from this repo's gh-pages branch at
#   https://docs.cornerstonedata.org/eeio-docs/pr-preview/pr-<number>/
# (the hub repo cornerstone-data.github.io owns the custom domain, so this repo's
# project site is served under /eeio-docs/ on it).
name: PR build and preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /eeio-docs/pr-preview/pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22.x
      - name: Install MyST
        if: github.event.action != 'closed'
        run: npm install -g mystmd
      - name: Build HTML (fails on errors)
        if: github.event.action != 'closed'
        run: myst build --html --strict
      - name: Copy interactive figures into the site
        if: github.event.action != 'closed'
        run: mkdir -p _build/html/interactive && cp figures/interactive/*.html _build/html/interactive/
      - name: Deploy or remove preview
        # Fork PRs can't push to gh-pages; they still get the build check above.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_build/html

  link-check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install MyST
        run: npm install -g mystmd
      - name: Check links
        run: myst build --check-links --strict
